<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo 协同评审</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111319;color:#eff1f6;font:16px/1.6 system-ui,sans-serif}header,main{max-width:1280px;margin:auto;padding:24px}header{border-bottom:1px solid #343944}h1{font-size:30px}h2{font-size:24px}h3{font-size:16px}p{max-width:80ch}button,input{font:inherit}button{background:#252c3a;color:inherit;border:1px solid #576279;border-radius:8px;padding:9px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #88bcff}input{padding:8px;border:1px solid #667;background:#161b25;color:inherit;border-radius:6px;max-width:100%}.muted{color:#aab4c7;font-size:14px}.actions,.palettes,.sizes{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.card{padding:28px 0;border-bottom:1px solid #343944}.columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:24px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.art{background:#e9eaf0;border-radius:12px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:contain}.palette{padding:6px;max-width:130px;font-size:14px}.palette img{width:70px;height:70px;object-fit:contain;display:block;margin:auto}.palette[aria-pressed=true]{border-color:#a5c9ff;background:#273e65}.sizes>div{text-align:center;font-size:14px}.sizes canvas{display:block;margin:10px auto}.phone-wrap{background:#191f2c;padding:16px;border-radius:12px;text-align:center}.phone{display:block;width:100%;max-width:300px;margin:auto;height:auto;border-radius:20px}.confirm{margin-top:20px}dialog{color:#eff1f6;background:#202633;border:1px solid #68738b;border-radius:12px;max-width:560px;padding:24px}dialog::backdrop{background:#0009}@media(max-width:760px){.columns{grid-template-columns:1fr}header,main{padding:18px}.comparison{gap:8px}.actions{align-items:stretch}h1{font-size:25px}.palette{flex:1}.phone{max-width:300px}}
</style>
<header><h1 id="title"></h1><p>原稿、当前版本、配色和手机主屏放在同一处比较。</p><div class="actions"><label>评审人 <input id="reviewer" placeholder="填写姓名或代号" maxlength="80"></label><button id="sync" disabled>同步到 Figma…</button></div><p id="status" class="muted" role="status">确认绑定具体版本及配色；选择仅在本页会话中保留，导出后可交接。</p></header>
<main id="content"></main>
<dialog id="handoff"><h2>同步包已生成</h2><p>当前网页未连接 Figma 写入权限，尚未同步。</p><p>在 Figma 桌面版中导入本评审目录下 figma-plugin/manifest.json 开发插件；运行插件、选择刚下载的 JSON，再点击“导入确认方案”。也可把 JSON 交给有 Figma 权限的 Agent。</p><p class="muted">文字可编辑；Logo 与手机场景以位图导入。插件实际完成后才算同步成功。</p><button id="close">知道了</button></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('review-data').textContent);
const images=new Map(), rows=new Map();
const status=document.getElementById('status'),sync=document.getElementById('sync');
const kindLabels={'original':'原版','color-artwork':'独立配色','filter-preview':'滤镜预览','grayscale-preview':'灰度检查','monochrome-artwork':'单色适配'};
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=tag==='small'?(kindLabels[text]||text):text;if(cls)e.className=cls;return e};
function img(path,filter='none'){const i=el('img');i.src=data.assets[path].data;i.alt='Logo 评审图';i.style.filter=filter;return i}
function context(w,h){const c=el('canvas');c.width=w;c.height=h;return c}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip()}
function icon(c,p,size){const canvas=context(size,size),ctx=canvas.getContext('2d'),a=c.placement,im=images.get(p.asset);round(ctx,0,0,size,size,size*.203);ctx.fillStyle=a.background;ctx.fillRect(0,0,size,size);ctx.filter=p.filter;const w=size*a.scale,h=w*im.height/im.width;ctx.drawImage(im,size*a.x,size*a.y,w,h);return canvas}
function phone(c,p){const s=data.scene||{width:375,height:812,slot:[7.2,70.8128,17.0667]},canvas=context(s.width,s.height),ctx=canvas.getContext('2d');ctx.fillStyle='#0c1730';ctx.fillRect(0,0,s.width,s.height);for(const key of ['background','overlay'])if(s[key]){const [x,y,w,h]=s[key+'Rect'];ctx.drawImage(images.get(s[key]),x*s.width/100,y*s.height/100,w*s.width/100,h*s.height/100)}const [x,y,w]=s.slot,z=w*s.width/100;ctx.drawImage(icon(c,p,256),x*s.width/100,y*s.height/100,z,z);ctx.font='12px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(data.project,(x+w/2)*s.width/100,y*s.height/100+z+20);return canvas}
function update(row){const {c,p,art,sizes,scene,confirm,buttons}=row;art.replaceChildren(img(p.asset,p.filter));sizes.replaceChildren();for(const n of [24,32,48,64]){const cell=el('div',n+' px');cell.prepend(icon(c,p,n));sizes.append(cell)}const ph=phone(c,p);ph.className='phone';scene.replaceChildren(ph);row.phone=ph;row.approval=null;confirm.textContent='确认此版本与配色';buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(c.palettes[i]===p)));sync.disabled=!Array.from(rows.values()).some(r=>r.approval)}
async function init(){document.getElementById('title').textContent=data.project+' · Logo 评审 / '+data.revision;await Promise.all(Object.entries(data.assets).map(([key,a])=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{images.set(key,i);resolve()};i.onerror=()=>reject(new Error('图片载入失败：'+key));i.src=a.data})));for(const c of data.concepts.filter(c=>c.status!=='parked')){const card=el('section',null,'card');card.append(el('h2',c.title+' / '+c.version));card.append(el('p',c.concept),el('p','本轮：'+c.changes,'muted'));const cols=el('div',null,'columns'),left=el('div'),right=el('div',null,'phone-wrap'),compare=el('div',null,'comparison'),before=el('div'),after=el('div');before.append(el('h3','上一版本'));const old=el('div',null,'art');if(c.previous)old.append(img(c.previous));else old.textContent='本轮为首稿';before.append(old);after.append(el('h3','当前版本'));const art=el('div',null,'art');after.append(art);compare.append(before,after);left.append(compare);const palettes=el('div',null,'palettes');palettes.setAttribute('role','group');palettes.setAttribute('aria-label',c.title+'配色');left.append(el('h3','配色对比'),palettes);const sizes=el('div',null,'sizes');left.append(el('h3','实际像素尺寸'),sizes);const confirm=el('button','确认此版本与配色','confirm');left.append(confirm);right.append(el('h3','手机主屏应用'));const scene=el('div');right.append(scene,el('p',data.scene?.label||'示意场景 · 尚未提供真实主屏素材','muted'));cols.append(left,right);card.append(cols);document.getElementById('content').append(card);const row={c,p:c.palettes[0],art,sizes,scene,confirm,buttons:[],approval:null};rows.set(c.id,row);c.palettes.forEach(p=>{const b=el('button',null,'palette');b.append(img(p.asset,p.filter),el('span',p.label),el('small',p.kind));b.onclick=()=>{row.p=p;update(row)};palettes.append(b);row.buttons.push(b)});confirm.onclick=()=>{const by=document.getElementById('reviewer').value.trim();if(!by){status.textContent='请先填写评审人。';document.getElementById('reviewer').focus();return}row.approval={by,at:new Date().toISOString(),version:c.version,paletteId:row.p.id};confirm.textContent='已确认：'+row.p.label;sync.disabled=false;status.textContent='已在当前会话确认；请导出同步包保存记录。'};update(row)}}
function download(value){const blob=new Blob([JSON.stringify(value)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='logo-review-'+data.snapshotBase.slice(0,12)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
sync.onclick=()=>{try{const selected=Array.from(rows.values()).filter(r=>r.approval);if(!selected.length)return;const selection=selected.map(r=>r.c.id+':'+r.p.id).join('|');const payload={schemaVersion:1,project:data.project,revision:data.revision,snapshotId:data.snapshotBase+':'+selection,createdAt:new Date().toISOString(),items:selected.map(r=>{const source=images.get(r.p.asset),full=context(source.width,source.height),ctx=full.getContext('2d');ctx.filter=r.p.filter;ctx.drawImage(source,0,0);return{id:r.c.id,version:r.c.version,title:r.c.title,palette:r.p.label,kind:r.p.kind,concept:r.c.concept,changes:r.c.changes,approval:r.approval,sourceSha256:data.assets[r.p.asset].sha256,logo:full.toDataURL('image/png'),phone:r.phone.toDataURL('image/png'),phoneWidth:r.phone.width,phoneHeight:r.phone.height}})};download(payload);status.textContent='同步包已生成；等待 Figma 导入。';document.getElementById('handoff').showModal()}catch(e){status.textContent='导出失败：'+e.message}};
document.getElementById('close').onclick=()=>document.getElementById('handoff').close();
init().catch(e=>{status.textContent=e.message;sync.disabled=true});
</script>
</html>
